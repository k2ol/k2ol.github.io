		<script>
			// ================= 鍵定義 =================
			// act: 'shift' 'left' 'right' 'del' 'ac' 'eq' 'ins:…' 'dr' 'mr' 'mstore' 'mplus' 'mminus'
			//      'dms' 'ran' 'sign' 'hyp' 'tip:…'
			const KEYS = [
				// 第一列

				{ id: 'menu', label: 'MENU', act: 'menu' },

				// 第五列
				{ id: 'dms', label: "D°M'S", act: 'dms', sl: 'STAT' },
				{ id: 'dc', label: 'd/c', act: 'tip:未開放', sl: 'aᵇ/c' },
				{ id: 'xvar', label: 'X', act: 'ins:X', sl: 'Y' },
				{ id: 'xym', label: 'XY,M', act: 'comma', sl: 'STO' },
				{ id: 'mr', label: 'MR', act: 'mr', sl: 'M+', cls: 'k-num' },
				{ id: 'mstore', label: 'x→M', act: 'mstore', sl: 'M−', cls: 'k-num' },
				// 數字區（3 欄黑鍵 + 2 欄灰鍵 + 1 空欄）
				{ id: 'n7', label: '7', act: 'ins:7', cls: 'k-num', sl: 'CPLX' },
				{ id: 'n8', label: '8', act: 'ins:8', cls: 'k-num', sl: '∞' },
				{ id: 'n9', label: '9', act: 'ins:9', cls: 'k-num', sl: '1̄23' },
				{ id: 'lp', label: '(', act: 'ins:(', cls: 'k-op', sl: '%' },
				{ id: 'rp', label: ')', act: 'ins:)', cls: 'k-op', sl: 'mod' },
				{ blank: true },
				{ id: 'n4', label: '4', act: 'ins:4', cls: 'k-num', sl: 'n!' },
				{ id: 'n5', label: '5', act: 'ins:5', cls: 'k-num', sl: 'nCr' },
				{ id: 'n6', label: '6', act: 'ins:6', cls: 'k-num', sl: 'nPr' },
				{ id: 'mul', label: '×', act: 'ins:×', cls: 'k-op', sl: '▷BIN' },
				{ id: 'div', label: '÷', act: 'ins:÷', cls: 'k-op', sl: '▷OCT' },
				{ blank: true },
				{ id: 'n1', label: '1', act: 'ins:1', cls: 'k-num', sl: 'CNST' },
				{ id: 'n2', label: '2', act: 'ins:2', cls: 'k-num', sl: 'CONV' },
				{ id: 'n3', label: '3', act: 'ins:3', cls: 'k-num', sl: 'abs' },
				{ id: 'add', label: '＋', act: 'ins:＋', cls: 'k-op', sl: '▷DEC' },
				{ id: 'sub', label: '−', act: 'ins:−', cls: 'k-op', sl: '▷HEX' },
				{ blank: true },
				{ id: 'n0', label: '0', act: 'ins:0', cls: 'k-num', sl: 'OTHER' },
				{ id: 'dot', label: '.', act: 'ins:.', cls: 'k-num', sl: 'ran#' },
				{ id: 'sgn', label: '＋/−', act: 'sign', cls: 'k-num', sl: 'Ans' },
				{ id: 'exp', label: 'EXP', act: 'ins:E', cls: 'k-op', sl: 'EXP SI' },
				{ id: 'eq', label: '✓', act: 'eq', cls: 'k-eq', sl: '=,<,>' },
			];

			const pad = document.getElementById('pad');
			const tipEl = document.getElementById('tip');
			const exprEl = document.getElementById('expr-line');
			const resultEl = document.getElementById('result');
			const indDrg = document.getElementById('ind-drg');
			const indShift = document.getElementById('ind-shift');
			const indMem = document.getElementById('ind-mem');
			const subInd = document.getElementById('sub-ind');

			// ================= 狀態 =================
			let expr = ''; // 運算式字串
			let cursor = 0; // 游標位置（字元索引）
			let result = null; // 上一次計算結果
			let lastExpr = '';
			let resultMode = false; // 顯示結果中
			let errMsg = null;
			let shiftOn = false;
			let hypOn = false;
			let drg = 'DEG'; // DEG | RAD | GRA
			let mem = 0;
			let memSet = false;
			let ansVal = null;
			let vars = { X: 0, Y: 0 };
			let dispMode = 'norm'; // norm | fix | sci
			let fixDigits = 6, sciDigits = 6;
			let engOn = false;
			let stoMode = false;
			let cnstIdx = 0, convIdx = 0;

			function fmt(v) {
				if (!isFinite(v)) return v > 0 ? '∞' : '-∞';
				if (v === 0) return dispMode === 'sci' ? (0).toExponential(sciDigits) : '0';
				if (engOn) {
					const exp = Math.floor(Math.log10(Math.abs(v)) / 3) * 3;
					const m = v / Math.pow(10, exp);
					return m.toFixed(Math.max(0, 9 - String(Math.abs(exp)).length - 2)) + 'e' + (exp >= 0 ? '+' : '') + exp;
				}
				if (dispMode === 'fix') return v.toFixed(fixDigits);
				if (dispMode === 'sci') return v.toExponential(sciDigits);
				if (Math.abs(v) >= 1e10 || Math.abs(v) < 1e-9) {
					return v.toExponential(7).replace(/(.d*?)0+e/, '$1e').replace(/.e/, 'e');
				}
				return String(parseFloat(v.toPrecision(10)));
			}

			function factorial(n) {
				if (n < 0 || n !== Math.floor(n) || n > 170) throw new Error('Math');
				let r = 1;
				for (let i = 2; i <= n; i++) r *= i;
				return r;
			}

			// ================= 表示式求值器 =================
			function evaluate(src, drgMode, ans) {
				let s = src.replace(/ mod /g, '');
				let pos = 0;
				const FUNCS = ['sinh', 'cosh', 'tanh', 'asin', 'acos', 'atan', 'sin', 'cos', 'tan', 'log', 'ln', 'abs', 'nCr', 'nPr'];
				function ws() {
					while (s[pos] === ' ') pos++;
				}
				function err(type) {
					throw new Error(type);
				}
				function toRad(v) {
					return drgMode === 'DEG' ? (v * Math.PI) / 180 : drgMode === 'GRA' ? (v * Math.PI) / 200 : v;
				}
				function fromRad(v) {
					return drgMode === 'DEG' ? (v * 180) / Math.PI : drgMode === 'GRA' ? (v * 200) / Math.PI : v;
				}
				function applyFn(name, args) {
					const one = (v) => { if (args.length !== 1) err('Syntax'); return args[0]; };
					switch (name) {
						case 'sin':
							return Math.sin(toRad(one(args)));
						case 'cos':
							return Math.cos(toRad(one(args)));
						case 'tan': {
							const v = one(args);
							const r = Math.tan(toRad(v));
							if (Math.abs(r) > 1e15) err('Math');
							return r;
						}
						case 'asin': {
							const v = one(args);
							if (v < -1 || v > 1) err('Math');
							return fromRad(Math.asin(v));
						}
						case 'acos': {
							const v = one(args);
							if (v < -1 || v > 1) err('Math');
							return fromRad(Math.acos(v));
						}
						case 'atan':
							return fromRad(Math.atan(one(args)));
						case 'sinh':
							return Math.sinh(one(args));
						case 'cosh':
							return Math.cosh(one(args));
						case 'tanh':
							return Math.tanh(one(args));
						case 'log': {
							if (args.length === 1) {
								if (args[0] <= 0) err('Math');
								return Math.log10(args[0]);
							}
							if (args.length === 2) {
								if (args[0] <= 0 || args[1] <= 0 || args[1] === 1) err('Math');
								return Math.log(args[0]) / Math.log(args[1]);
							}
							err('Syntax');
						}
						case 'ln': {
							const v = one(args);
							if (v <= 0) err('Math');
							return Math.log(v);
						}
						case 'abs':
							return Math.abs(one(args));
						case 'nCr': {
							if (args.length !== 2) err('Syntax');
							const n = args[0], r = args[1];
							if (n < 0 || r < 0 || n !== Math.floor(n) || r !== Math.floor(r) || r > n) err('Math');
							return factorial(n) / (factorial(r) * factorial(n - r));
						}
						case 'nPr': {
							if (args.length !== 2) err('Syntax');
							const n = args[0], r = args[1];
							if (n < 0 || r < 0 || n !== Math.floor(n) || r !== Math.floor(r) || r > n) err('Math');
							return factorial(n) / factorial(n - r);
						}
					}
				}
				function parseExpr() {
					let v = parseTerm();
					ws();
					while (s[pos] === '＋' || s[pos] === '−' || s[pos] === '+') {
						const op = s[pos];
						pos++;
						const r = parseTerm();
						v = op === '＋' ? v + r : v - r;
						ws();
					}
					return v;
				}
				function startsPrimary() {
					ws();
					const ch = s[pos];
					if (ch === undefined) return false;
					return /[\d.]/.test(ch) || ch === 'X' || ch === 'Y' || ch === '(' || ch === 'π' || ch === 'e' || ch === '√' || ch === '³' || FUNCS.some((f) => s.startsWith(f, pos)) || s.startsWith('Ans', pos);
				}
				function parseTerm() {
					let v = parseFactor();
					ws();
					for (;;) {
						if (s[pos] === '×' || s[pos] === '÷') {
							const op = s[pos++];
							const r = parseFactor();
							if (op === '÷' && r === 0) err('Math');
							v = op === '×' ? v * r : v / r;
						} else if (s.charCodeAt(pos) === 7) {
							pos += 1;
							const r = parseFactor();
							if (r === 0) err('Math');
							v = ((v % r) + r) % r;
						} else if (startsPrimary()) {
							const r = parseFactor(); // 隱含乘法，如 2π、3(4+5)
							v = v * r;
						} else break;
						ws();
					}
					return v;
				}
				function parseFactor() {
					ws();
					if (s[pos] === '−' || s[pos] === '-') {
						pos++;
						return -parseFactor();
					}
					return parsePower();
				}
				function parsePower() {
					const base = parsePostfix();
					ws();
					if (s[pos] === '^') {
						pos++;
						const exp = parseFactor(); // 右結合，且 -2^2 = -4
						return Math.pow(base, exp);
					}
					if (s.startsWith('ˣ√', pos)) {
						pos += 2;
						if (base === 0) err('Math');
						const r2 = parseFactor();
						return Math.pow(r2, 1 / base);
					}
					return base;
				}
				function parsePostfix() {
					let v = parsePrimary();
					for (;;) {
						ws();
						if (s[pos] === '!') {
							pos++;
							v = factorial(v);
						} else if (s[pos] === '%') {
							pos++;
							v = v / 100;
						} else break;
					}
					return v;
				}
				function parsePrimary() {
					ws();
					const num = /^(?:\d+(?:\.\d*)?|\.\d+)(?:E[+-]?\d+)?/.exec(s.slice(pos));
					if (num) {
						pos += num[0].length;
						return parseFloat(num[0]);
					}
					if (s.startsWith('Ans', pos)) {
						pos += 3;
						if (ans === null) err('Syntax');
						return ans;
					}
					if (s[pos] === 'π') {
						pos++;
						return Math.PI;
					}
					if (s[pos] === 'e') {
						pos++;
						return Math.E;
					}
					if (s[pos] === '√') {
						pos++;
						if (parsePeekNeg()) err('Syntax');
						const v = parseFactor();
						if (v < 0) err('Math');
						return Math.sqrt(v);
					}
					if (s.startsWith('³√', pos)) {
						pos += 2;
						return Math.cbrt(parseFactor());
					}
					if (s[pos] === '(') {
						pos++;
						const v = parseExpr();
						ws();
						if (s[pos] !== ')') err('Syntax');
						pos++;
						return v;
					}
					function readRawArg() {
						let d = 0, out = '';
						while (pos < s.length) {
							const ch = s[pos];
							if (ch === '(') d++;
							if (ch === ')') { if (d === 0) break; d--; }
							if (ch === ',' && d === 0) break;
							out += ch;
							pos++;
						}
						return out;
					}
					if (s[pos] === 'X') { pos++; return vars.X; }
					if (s[pos] === 'Y') { pos++; return vars.Y; }
					if (s.startsWith('Σ(', pos)) {
						pos += 2;
						const fsrc = readRawArg();
						ws();
						if (s[pos] !== ',') err('Syntax');
						pos++;
						const a2 = parseExpr();
						ws();
						if (s[pos] !== ',') err('Syntax');
						pos++;
						const b2 = parseExpr();
						ws();
						if (s[pos] !== ')') err('Syntax');
						pos++;
						if (isNaN(a2) || isNaN(b2)) err('Syntax');
						let lo = Math.ceil(a2), hi = Math.floor(b2);
						if (lo > hi) { const t2 = lo; lo = hi; hi = t2; }
						if (hi - lo > 100000) err('Math');
						let sum = 0;
						for (let x = lo; x <= hi; x++) {
							const sv = vars.X;
							vars.X = x;
							try { sum += evaluate(fsrc, drgMode, ans); } finally { vars.X = sv; }
						}
						return sum;
					}
					if (s.startsWith('∫(', pos)) {
						pos += 2;
						const fsrc = readRawArg();
						ws();
						if (s[pos] !== ',') err('Syntax');
						pos++;
						const a3 = parseExpr();
						ws();
						if (s[pos] !== ',') err('Syntax');
						pos++;
						const b3 = parseExpr();
						ws();
						if (s[pos] !== ')') err('Syntax');
						pos++;
						const n3 = 200;
						const h3 = (b3 - a3) / n3;
						if (h3 === 0) return 0;
						const f3 = (x) => { const sv = vars.X; vars.X = x; const r = evaluate(fsrc, drgMode, ans); vars.X = sv; return r; };
						let sum = f3(a3) + f3(b3);
						for (let i = 1; i < n3; i++) sum += f3(a3 + i * h3) * (i % 2 ? 4 : 2);
						return (sum * h3) / 3;
					}
					if (s.startsWith('d/dx(', pos)) {
						pos += 5;
						const fsrc = readRawArg();
						ws();
						if (s[pos] !== ',') err('Syntax');
						pos++;
						const a4 = parseExpr();
						ws();
						if (s[pos] !== ')') err('Syntax');
						pos++;
						const h4 = 1e-5 * Math.max(1, Math.abs(a4));
						const f4 = (x) => { const sv = vars.X; vars.X = x; const r = evaluate(fsrc, drgMode, ans); vars.X = sv; return r; };
						return (f4(a4 + h4) - f4(a4 - h4)) / (2 * h4);
					}
					for (const f of FUNCS) {
						if (s.startsWith(f + '(', pos)) {
							pos += f.length + 1;
							const args = [parseExpr()];
							ws();
							while (s[pos] === ',') {
								pos++;
								args.push(parseExpr());
								ws();
							}
							if (s[pos] !== ')') err('Syntax');
							pos++;
							return applyFn(f, args);
						}
					}
					err('Syntax');
				}
				function parsePeekNeg() {
					// √ 後直接接運算符等錯誤由主流程處理
					return false;
				}
				const v = parseExpr();
				ws();
				if (pos !== s.length) err('Syntax');
				return v;
			}

			// ================= 顯示 =================
			function render() {
				// 運算式列（含游標）
				exprEl.innerHTML = '';
				if (resultMode) {
					exprEl.textContent = lastExpr;
				} else {
					exprEl.append(document.createTextNode(expr.slice(0, cursor)));
					const c = document.createElement('span');
					c.className = 'cur';
					exprEl.append(c);
					exprEl.append(document.createTextNode(expr.slice(cursor)));
				}
				if (resultMode) {
					resultEl.textContent = errMsg ? errMsg : result === null ? 'ERROR' : fmt(result);
				} else {
					resultEl.textContent = expr === '' ? '0' : '';
				}
				indDrg.textContent = drg;
				indDrg.className = 'on';
				indShift.textContent = hypOn ? 'S H' : shiftOn ? 'S' : '';
				indShift.className = shiftOn || hypOn ? 'on' : '';
				indMem.textContent = memSet ? 'M' : '';
				indMem.className = memSet ? 'on' : '';
				document.getElementById('ind-disp').textContent =
					dispMode === 'fix' ? 'Fix' : dispMode === 'sci' ? 'Sci' : engOn ? 'ENG' : '';
				document.getElementById('ind-disp').className = dispMode !== 'norm' || engOn ? 'on' : '';
				document.getElementById('ind-sto').textContent = stoMode ? 'STO' : '';
				document.getElementById('ind-sto').className = stoMode ? 'on' : '';
				// SHIFT 狀態下高亮有第二功能的鍵
				document.querySelectorAll('.kcell[data-has-shift]').forEach((k) => {
					k.classList.toggle('shift-on', shiftOn);
				});
			}

			function tip(msg) {
				tipEl.textContent = msg;
				setTimeout(() => (tipEl.textContent = ''), 2200);
			}

			// 插入字串；cont=true 表示接續上一個結果（運算符開頭 → 以 Ans 續算）
			function ensureInputMode() {
				if (resultMode) {
					resultMode = false;
					errMsg = null;
					expr = '';
					cursor = 0;
				}
			}

			function insert(str, cont) {
				if (resultMode) {
					if (cont && /^[+＋−×÷^!%ˣ]/.test(str)) {
						expr = 'Ans';
						cursor = 3;
					} else {
						expr = '';
						cursor = 0;
					}
					resultMode = false;
					errMsg = null;
				}
				expr = expr.slice(0, cursor) + str + expr.slice(cursor);
				cursor += str.length;
				// 模板類（含逗號的函數模板）把游標移到第一個逗號，方便依序填寫
				const firstComma = str.indexOf(',');
				if (firstComma > 0 && str.endsWith(')')) {
					cursor = cursor - str.length + firstComma;
				} else if (str.endsWith('(') && str !== '(') {
					// 函數開頭（log( / nCr( / d/dx( / abs(）：自動補右括號，游標停在 ( 後
					expr = expr.slice(0, cursor) + ')' + expr.slice(cursor);
				}
				render();
			}

			function press(id) {
				const key = KEYS.find((k) => k.id === id);
				if (!key) return;
				const useShift = shiftOn;
				if (stoMode && (id === 'xvar' || id === 'mr')) {
					const v = currentNum();
					if (v === null) tip('沒有可儲存的數值');
					else if (id === 'xvar') {
						if (useShift) { vars.Y = v; tip('Y=' + fmt(v)); }
						else { vars.X = v; tip('X=' + fmt(v)); }
					} else { mem = v; memSet = true; tip('M=' + fmt(v)); }
					stoMode = false;
					render();
					return;
				}
				if (stoMode && id !== 'shift') stoMode = false;
				if (shiftOn && id !== 'shift') shiftOn = false;
				if (hypOn && !['shift', 'pi', 'sin', 'cos', 'tan'].includes(id)) hypOn = false;
				const act = useShift && key.sl ? 'SHIFT:' + key.sl + ':' + key.id : key.act;
				execute(act, id, useShift);
				render();
			}

			function execute(act, id, useShift) {
				if (act.startsWith('tip:')) return tip(act.slice(4));
				if (act === 'shift') {
					shiftOn = !shiftOn;
					return;
				}
				switch (act) {
					case 'left':
						if (resultMode) {
							resultMode = false;
							expr = lastExpr;
							cursor = expr.length;
						} else cursor = Math.max(0, cursor - 1);
						return;
					case 'right':
						if (resultMode) {
							resultMode = false;
							expr = lastExpr;
							cursor = expr.length;
						} else cursor = Math.min(expr.length, cursor + 1);
						return;
					case 'del':
						ensureInputMode();
						if (cursor > 0) {
							expr = expr.slice(0, cursor - 1) + expr.slice(cursor);
							cursor--;
						}
						return;
					case 'ac':
						expr = '';
						cursor = 0;
						result = null;
						resultMode = false;
						lastExpr = '';
						subInd.textContent = '';
						return;
					case 'eq': {
						if (expr === '' && result === null) return;
						const src = expr === '' ? lastExpr : expr;
						if (hasTopComma(src)) {
							try {
								const vals = splitTop(src).map((p) => evaluate(p, drg, ansVal));
								const n2 = vals.length;
								const sum = vals.reduce((a2, b2) => a2 + b2, 0);
								ansVal = sum / n2;
								result = ansVal;
								lastExpr = src;
								resultMode = true;
								errMsg = null;
								subInd.textContent = 'n=' + n2 + '　Σx=' + fmt(sum);
							} catch (e2) {
								result = null;
								resultMode = true;
								errMsg = e2.message === 'Math' ? 'Math ERROR' : 'Syntax ERROR';
							}
							return;
						}
						try {
							const v = evaluate(src, drg, ansVal);
							ansVal = v;
							result = v;
							lastExpr = src;
							resultMode = true;
							errMsg = null;
							cursor = 0;
							subInd.textContent = '';
						} catch (e) {
							result = null;
							lastExpr = src;
							resultMode = true;
							errMsg = e.message === 'Math' ? 'Math ERROR' : 'Syntax ERROR';
							subInd.textContent = '按 AC 或 ◀ 重新編輯';
						}
						return;
					}
					case 'dr':
						drg = drg === 'DEG' ? 'RAD' : drg === 'RAD' ? 'GRA' : 'DEG';
						return;
					case 'mr':
						ensureInputMode();
						insert(String(mem));
						return;
					case 'mstore': {
						const v = currentNum();
						if (v === null) return tip('沒有可儲存的數值');
						mem = v;
						memSet = true;
						return tip('已存入 M');
					}
					case 'mplus': {
						const v = currentNum();
						if (v === null) return tip('沒有可加入的數值');
						mem += v;
						memSet = true;
						return tip('M+ ' + fmt(v));
					}
					case 'mminus': {
						const v = currentNum();
						if (v === null) return tip('沒有可扣減的數值');
						mem -= v;
						memSet = true;
						return tip('M− ' + fmt(v));
					}
					case 'dms': {
						const v = currentNum();
						if (v === null) return tip('先算出一個數值');
						const sign = v < 0 ? '-' : '';
						const abs = Math.abs(v);
						const d = Math.floor(abs);
						const mFull = (abs - d) * 60;
						const m = Math.floor(mFull);
						const sec = ((mFull - m) * 60).toFixed(1);
						subInd.textContent = sign + d + '°' + m + "'" + sec + '"';
						return;
					}
					case 'ran': {
						ensureInputMode();
						insert(String(Math.floor(Math.random() * 1000) / 1000));
						return;
					}
					case 'sign': {
						ensureInputMode();
						// 翻轉游標前最後一個數字的正負號
						const m = /(-?(?:\d+\.?\d*|\.\d+)(?:E[+-]?\d+)?)$/.exec(expr.slice(0, cursor));
						if (!m) {
							insert('−');
							return;
						}
						const numStr = m[1];
						const start = cursor - numStr.length;
						const neg = numStr.startsWith('-');
						const core = neg ? numStr.slice(1) : numStr;
						const newNum = neg ? core : '-' + core;
						expr = expr.slice(0, start) + newNum + expr.slice(cursor);
						cursor = start + newNum.length;
						return;
					}
					case 'hyp':
						hypOn = !hypOn;
						tip(hypOn ? 'hyp：下一個 sin/cos/tan 為雙曲函數' : '');
						return;
					case 'comma': {
						// 模板填寫：覆寫游標後的逗號（若在模板逗號上），並跳到下一個逗號/收尾
						const nextCh = expr[cursor];
						if (nextCh === ',') {
							cursor++;
						} else if (nextCh === ')' || nextCh === undefined) {
							// 已到結尾：在最後一個逗號後插入
							expr = expr.slice(0, cursor) + ',' + expr.slice(cursor);
							cursor++;
						} else {
							expr = expr.slice(0, cursor) + ',' + expr.slice(cursor);
							cursor++;
						}
						// 跳到再下一個逗號或 ) 前
						const nc = expr.indexOf(',', cursor);
						if (nc >= 0) cursor = nc;
						else {
							const rc = expr.indexOf(')', cursor);
							if (rc >= 0) cursor = rc;
						}
						return;
					}
					case 'eng':
						engOn = !engOn;
						return tip('工程記號：' + (engOn ? '開' : '關'));
					case 'fse':
						dispMode = dispMode === 'norm' ? 'fix' : dispMode === 'fix' ? 'sci' : 'norm';
						return tip('顯示：' + (dispMode === 'norm' ? 'Norm' : dispMode === 'fix' ? 'Fix ' + fixDigits + ' 位' : 'Sci ' + sciDigits + ' 位'));
					case 'sto':
						stoMode = true;
						return tip('STO：先算出數值，再按 X 存入（SHIFT+X 為 Y）');
					case 'cnst': {
						const CNSTS = [['光速 c', 299792458], ['重力加速度 g', 9.80665], ['普朗克常數 h', 6.62607015e-34], ['亞佛加厥數 NA', 6.02214076e23]];
						const c2 = CNSTS[cnstIdx % CNSTS.length];
						cnstIdx++;
						insert(fmt(c2[1]));
						return tip('常數：' + c2[0]);
					}
					case 'conv': {
						const CONVS = [
							['°C→°F', (x) => x * 9 / 5 + 32],
							['°F→°C', (x) => ((x - 32) * 5) / 9],
							['in→cm', (x) => x * 2.54],
							['cm→in', (x) => x / 2.54],
							['ft→m', (x) => x * 0.3048],
							['m→ft', (x) => x / 0.3048],
							['kg→lb', (x) => x * 2.2046226218],
							['lb→kg', (x) => x / 2.2046226218],
							['L→gal(US)', (x) => x * 0.2641720524],
							['gal(US)→L', (x) => x / 0.2641720524],
						];
						const v = currentNum();
						if (v === null) return tip('先輸入數值');
						const c3 = CONVS[convIdx % CONVS.length];
						convIdx++;
						result = c3[1](v);
						ansVal = result;
						lastExpr = c3[0];
						resultMode = true;
						errMsg = null;
						return tip('單位換算：' + c3[0]);
					}
					case 'theme': {
						const next = document.documentElement.dataset.theme === 'dark' ? 'light' : 'dark';
						document.documentElement.dataset.theme = next;
						localStorage.setItem('t-theme', next);
						return tip('主題：' + (next === 'dark' ? '深色' : '淺色'));
					}
					case 'menu': {
						const ov = document.getElementById('menu-ov');
						ov.classList.toggle('hidden');
						if (!ov.classList.contains('hidden')) {
							document.getElementById('m-dr').textContent = drg;
							document.getElementById('m-fse').textContent = dispMode;
							document.getElementById('m-eng').textContent = engOn ? '開' : '關';
						}
						return;
					}
				}
				if (act.startsWith('base:')) {
					const baseMap = { BIN: 2, OCT: 8, DEC: 10, HEX: 16 };
					const v = currentNum();
					if (v === null || !Number.isInteger(v)) return tip('需先算出整數');
					subInd.textContent = act.slice(5) + ': ' + Math.abs(v).toString(baseMap[act.slice(5)]).toUpperCase();
					return tip(v < 0 ? '（負號另計）' : '');
				}
				tip('未開放');
					if (act.startsWith('ins:')) {
					const str = act.slice(4);
					// 運算符／後綴接續上一結果（以 Ans 續算）
					return insert(str, /^[+＋−×÷^!%]/.test(str));
				}
				if (act.startsWith('fn:')) {
					let name = act.slice(3);
					if (useShift && ['sin', 'cos', 'tan'].includes(name)) name = 'a' + name; // asin/acos/atan
					if (hypOn && ['sin', 'cos', 'tan'].includes(name)) name = name + 'h';
					ensureInputMode();
					insert(name + '(');
					return;
				}
				if (act.startsWith('SHIFT:')) {
					const [, sl, kid] = act.split(':');
					switch (kid + '|' + sl) {
						case 'n4|n!':
							return insert('!');
						case 'dot|ran#':
							return execute('ran', 'dot', false);
						case 'n3|abs':
							return insert('abs(');
						case 'mr|M+':
							return execute('mplus', 'mr', false);
						case 'mstore|M−':
							return execute('mminus', 'mstore', false);
						case 'x2|x³':
							return insert('^3');
						case 'sqrt|³√x':
							return insert('³√(');
						case 'log|10ˣ':
							return insert('10^(');
case 'ln|eˣ':
							return insert('e^(');
case 'pi|hyp':
							return execute('hyp', 'pi', false);
						case 'lp|%':
							return insert('%', true);
						case 'rp|mod':
							if (resultMode) { expr = 'Ans'; cursor = 3; resultMode = false; errMsg = null; }
							return insert(' mod ');
						case 'fse|FSE':
							return execute('fse');
						case 'xym|STO':
							return execute('sto');
						case 'xvar|Y':
							return insert('Y');
						case 'int|d/dx':
							return insert('d/dx(');
						case 'pow|ˣ√y':
							return insert('ˣ√', true);
						case 'ec|log_x y':
							return insert('log(');
						case 'mul|▷BIN':
							return execute('base:BIN');
						case 'div|▷OCT':
							return execute('base:OCT');
						case 'add|▷DEC':
							return execute('base:DEC');
						case 'sub|▷HEX':
							return execute('base:HEX');
						case 'n1|CNST':
							return execute('cnst');
						case 'n2|CONV':
							return execute('conv');
						case 'n5|nCr':
							return insert('nCr(');
						case 'n6|nPr':
							return insert('nPr(');
						case 'sin|sin⁻¹':
							return insert('asin(');
						case 'cos|cos⁻¹':
							return insert('acos(');
						case 'tan|tan⁻¹':
							return insert('atan(');
						default:
							return tip('未開放');
					}
				}
			}

			function hasTopComma(src) {
				let d = 0;
				for (const ch of src) {
					if (ch === '(') d++;
					else if (ch === ')') d--;
					else if (ch === ',' && d === 0) return true;
				}
				return false;
			}
			function splitTop(src) {
				const parts = [];
				let d = 0, cur = '';
				for (const ch of src) {
					if (ch === '(') d++;
					if (ch === ')') d--;
					if (ch === ',' && d === 0) { parts.push(cur); cur = ''; continue; }
					cur += ch;
				}
				parts.push(cur);
				return parts;
			}

			// 目前可操作的數值：結果模式取結果；輸入模式取整段運算式的求值
			function currentNum() {
				try {
					if (resultMode && result !== null) return result;
					if (expr === '') return null;
					return evaluate(expr, drg, ansVal);
				} catch (e) {
					return null;
				}
			}

			// ================= 建立鍵盤 =================
			KEYS.forEach((k) => {
				const cell = document.createElement('div');
				if (k.blank) {
					cell.className = 'kcell blank';
					pad.append(cell);
					return;
				}
				cell.className = 'kcell' + (k.cls ? ' ' + k.cls : '');
				if (k.sl) {
					cell.dataset.hasShift = '1';
					const sl = document.createElement('span');
					sl.className = 'sl';
					sl.textContent = k.sl;
					cell.append(sl);
				} else {
					const sp = document.createElement('span');
					sp.className = 'sl';
					sp.innerHTML = '&nbsp;';
					cell.append(sp);
				}
				const b = document.createElement('button');
				b.textContent = k.label;
				if (k.id === 'eq') b.style.gridColumn = 'span 2';
				b.addEventListener('click', () => press(k.id));
				cell.append(b);
				pad.append(cell);
			});

			document.querySelectorAll('#menu-ov button').forEach((b) => {
				b.addEventListener('click', () => {
					const m = b.dataset.m;
					if (m === 'dr') {
						execute('dr');
						document.getElementById('m-dr').textContent = drg;
					} else if (m === 'fse') {
						execute('fse');
						document.getElementById('m-fse').textContent = dispMode;
					} else if (m === 'eng') {
						execute('eng');
						document.getElementById('m-eng').textContent = engOn ? '開' : '關';
					} else if (m === 'clrm') {
						mem = 0;
						memSet = false;
						tip('M 已清除');
					}
					render();
					if (m === 'close' || m === 'clrm') document.getElementById('menu-ov').classList.add('hidden');
				});
			});

			render();
		</script>
	</body>
</html>
