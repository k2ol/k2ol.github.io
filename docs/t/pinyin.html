function lookup() {
    var text = document.getElementById('inputBox').value.trim();
    document.getElementById('result').innerHTML = renderResult(text);
}

function renderResult(text) {
    if (!text) return '<div class="no-result">请在上方输入汉字</div>';
    
    var results = [];
    var hasChinese = false;
    
    for (var i = 0; i < text.length; i++) {
        var ch = text[i];
        var code = ch.charCodeAt(0);
        
        // Check if it's a CJK character
        if (code >= 0x4E00 && code <= 0x9FFF) {
            hasChinese = true;
            var pinyins = pinyinDict[ch];
            if (pinyins) {
                results.push({char: ch, pinyin: pinyins, hasData: true});
            } else {
                results.push({char: ch, pinyin: [], hasData: false});
            }
        }
    }
    
    if (!hasChinese) {
        return '<div class="no-result">未检测到汉字</div>';
    }
    
    // Single character mode
    if (results.length === 1 && results[0].hasData) {
        var r = results[0];
        var pyHtml = r.pinyin.map(function(py) {
            return '<span class="pinyin-item">' + py + '</span>';
        }).join('');
        return '<div class="result-card">' +
            '<div class="result-title">「' + r.char + '」的拼音</div>' +
            '<div class="result-content">' + pyHtml + '</div>' +
            '</div>';
    }
    
    // Sentence mode - show all pinyin per character
    var charsHtml = results.map(function(r) {
        if (!r.hasData) {
            return '<span class="char-pinyin"><span class="ch">' + r.char + '</span><span class="py">—</span></span>';
        }
        var pyText = r.pinyin.join(' / ');
        return '<span class="char-pinyin"><span class="ch">' + r.char + '</span><span class="py">' + pyText + '</span></span>';
    }).join('');
    
    var allPinyin = [];
    results.forEach(function(r) {
        if (r.hasData) {
            var py = r.pinyin[0];
            if (allPinyin.indexOf(py) === -1) allPinyin.push(py);
        }
    });
    
    var pinyinLine = '';
    if (allPinyin.length > 0) {
        var maxShow = allPinyin.slice(0, 30);
        pinyinLine = '<div class="result-card">' +
            '<div class="result-title">句中拼音（共 ' + allPinyin.length + ' 种）</div>' +
            '<div class="result-content">' + maxShow.map(function(py) {
                return '<span class="pinyin-item">' + py + '</span>';
            }).join('') + (allPinyin.length > 30 ? '<span style="color:#999">...还有 ' + (allPinyin.length - 30) + ' 种</span>' : '') + '</div>' +
            '</div>';
    }
    
    return '<div class="result-card">' +
        '<div class="result-title">逐字拼音</div>' +
        '<div class="result-content">' + charsHtml + '</div>' +
        '</div>' + pinyinLine;
}

// Enter key triggers lookup
document.getElementById('inputBox').addEventListener('keydown', function(e) {
    if (e.key === 'Enter') lookup();
});

// Auto-upgrade on input (debounced)
var timer;
document.getElementById('inputBox').addEventListener('input', function() {
    clearTimeout(timer);
    timer = setTimeout(lookup, 300);
});
