<!doctype html>
<html lang="zh-Hant">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" href="/favicon.ico" />
		<meta name="viewport" content="width=device-width" />
		<title>番茄鐘</title>
		<script>
			(() => {
				const saved = localStorage.getItem('t-theme');
				const theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
				document.documentElement.dataset.theme = theme;
			})();
		</script>
		<style>
			:root {
				--bg: #ffffff;
				--fg: #1a1a1a;
				--muted: #8a8a8a;
				--btn-bg: rgba(0, 0, 0, 0.06);
				--btn-hover: rgba(0, 0, 0, 0.12);
				--accent: #6366f1;
				--work: #e6532e;
				--short: #2e9e5b;
				--long: #2e8f9e;
			}
			html[data-theme='dark'] {
				--bg: #111111;
				--fg: #f5f5f5;
				--muted: #9a9a9a;
				--btn-bg: rgba(255, 255, 255, 0.08);
				--btn-hover: rgba(255, 255, 255, 0.16);
				--accent: #8b85ff;
			}
			body {
				margin: 0;
				min-height: 100vh;
				background: var(--bg);
				color: var(--fg);
				font-family: system-ui, -apple-system, 'Segoe UI', 'Noto Sans TC', sans-serif;
				display: flex;
				flex-direction: column;
				align-items: center;
				justify-content: center;
				gap: 1.2rem;
				padding: 2rem 1rem;
				box-sizing: border-box;
				transition: background 0.3s, color 0.3s;
				user-select: none;
			}
			#links {
				position: fixed;
				top: 1rem;
				right: 1rem;
				display: flex;
				gap: 0.7rem;
			}
			#links a {
				color: var(--muted);
				text-decoration: none;
				font-size: 1.2rem;
			}
			#links a:hover {
				color: var(--fg);
			}
			#phase-pill {
				font-size: 1.1rem;
				font-weight: 700;
				padding: 0.35rem 1.3rem;
				border-radius: 999px;
				color: #fff;
				background: var(--work);
				transition: background 0.3s;
			}
			#time {
				font-size: min(20vw, 7.2rem);
				font-weight: 800;
				line-height: 1;
				font-variant-numeric: tabular-nums;
				letter-spacing: 0.02em;
			}
			#dots {
				display: flex;
				gap: 0.6rem;
			}
			#dots .dot {
				width: 0.8rem;
				height: 0.8rem;
				border-radius: 50%;
				background: var(--btn-bg);
				border: 1px solid var(--muted);
			}
			#dots .dot.done {
				background: var(--accent);
				border-color: var(--accent);
			}
			#dots .dot.current {
				box-shadow: 0 0 0 3px var(--accent);
				border-color: var(--accent);
			}
			.row {
				display: flex;
				gap: 0.8rem;
				align-items: center;
				flex-wrap: wrap;
				justify-content: center;
			}
			.row > * {
				font: inherit;
				padding: 0.5rem 1.2rem;
				border-radius: 999px;
				border: none;
				background: var(--btn-bg);
				color: inherit;
				cursor: pointer;
			}
			.row > *:hover {
				background: var(--btn-hover);
			}
			#start-btn {
				font-size: 1.15rem;
				font-weight: 700;
				padding: 0.7rem 2.4rem;
				background: var(--accent);
				color: #fff;
			}
			#start-btn:hover {
				filter: brightness(1.1);
				background: var(--accent);
			}
			.setup {
				display: flex;
				gap: 1rem;
				align-items: center;
				flex-wrap: wrap;
				justify-content: center;
				color: var(--muted);
				font-size: 0.92rem;
			}
			.setup label {
				display: flex;
				align-items: center;
				gap: 0.4rem;
			}
			.setup input {
				font: inherit;
				width: 4.2rem;
				text-align: center;
				background: var(--btn-bg);
				color: inherit;
				border: 1px solid var(--btn-hover);
				border-radius: 0.5rem;
				padding: 0.3rem 0.2rem;
			}
			.setup input:focus {
				outline: 2px solid var(--accent);
			}
			.hint {
				color: var(--muted);
				font-size: 0.85rem;
				margin: 0;
			}
		</style>
	</head>
	<body>
		<div id="links">
			<a href="/t/index.html" title="工具箱">🧰</a>
			<a href="/" title="回首頁">🏠</a>
		</div>
		<div id="phase-pill">工作</div>
		<div id="time">25:00</div>
		<div id="dots"></div>
		<div class="row">
			<button id="start-btn">▶ 開始</button>
			<button id="reset-btn">↺ 重置</button>
			<button id="skip-btn">⏭ 跳過</button>
			<button id="sound-btn">音效：開</button>
		</div>
		<div class="setup">
			<label>工作 <input type="number" id="dur-work" min="1" max="120" value="25" /> 分</label>
			<label>短休息 <input type="number" id="dur-short" min="1" max="60" value="5" /> 分</label>
			<label>長休息 <input type="number" id="dur-long" min="1" max="90" value="15" /> 分</label>
		</div>
		<p class="hint">工作 4 輪後進入長休息；階段結束會響鈴並自動進入下一階段。</p>
		<script>
			const timeEl = document.getElementById('time');
			const pillEl = document.getElementById('phase-pill');
			const dotsEl = document.getElementById('dots');
			const startBtn = document.getElementById('start-btn');
			const soundBtn = document.getElementById('sound-btn');

			const PHASES = {
				work: { label: '工作', color: 'var(--work)' },
				short: { label: '短休息', color: 'var(--short)' },
				long: { label: '長休息', color: 'var(--long)' },
			};
			const ROUND_MAX = 4;
			// 各階段秒數（可由設定調整）
			let DUR = {
				work: (Number(localStorage.getItem('t-pomo-work')) || 25) * 60,
				short: (Number(localStorage.getItem('t-pomo-short')) || 5) * 60,
				long: (Number(localStorage.getItem('t-pomo-long')) || 15) * 60,
			};
			let phase = 'work';
			let round = 1; // 第幾輪工作
			let running = false;
			let endAt = 0; // 當前階段結束的絕對時間（Date.now 基準，背景分頁也不飄移）
			let remain = DUR[phase];
			let timerId = null;
			let sound = localStorage.getItem('t-sound') !== '0';
			let audioCtx = null;

			function fmt(s) {
				s = Math.max(0, Math.ceil(s));
				return String(Math.floor(s / 60)).padStart(2, '0') + ':' + String(s % 60).padStart(2, '0');
			}

			function render() {
				const left = running ? (endAt - Date.now()) / 1000 : remain;
				timeEl.textContent = fmt(left);
				pillEl.textContent = PHASES[phase].label + '　·　第 ' + round + ' 輪';
				pillEl.style.background = PHASES[phase].color;
				document.title = fmt(left) + ' ' + PHASES[phase].label + ' — 番茄鐘';
				renderDots();
			}

			function renderDots() {
				dotsEl.innerHTML = '';
				for (let i = 1; i <= ROUND_MAX; i++) {
					const d = document.createElement('div');
					d.className = 'dot' + (i < round ? ' done' : i === round && phase !== 'long' ? ' current' : '');
					dotsEl.append(d);
				}
			}

			function tick() {
				if (!running) return;
				const left = (endAt - Date.now()) / 1000;
				if (left <= 0) {
					phaseDone();
				} else {
					render();
				}
			}

			function start() {
				if (running) return;
				if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
				if (audioCtx.state === 'suspended') audioCtx.resume();
				running = true;
				endAt = Date.now() + remain * 1000;
				startBtn.textContent = '⏸ 暫停';
				timerId = setInterval(tick, 250);
				render();
			}

			function pause() {
				if (!running) return;
				running = false;
				clearInterval(timerId);
				remain = Math.max(0, (endAt - Date.now()) / 1000);
				startBtn.textContent = '▶ 繼續';
				render();
			}

			function bell() {
				if (!sound || !audioCtx) return;
				const times = [0, 0.5, 1];
				times.forEach((t) => {
					const osc = audioCtx.createOscillator();
					const gain = audioCtx.createGain();
					osc.frequency.value = 880;
					gain.gain.setValueAtTime(0.5, audioCtx.currentTime + t);
					gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + t + 0.4);
					osc.connect(gain).connect(audioCtx.destination);
					osc.start(audioCtx.currentTime + t);
					osc.stop(audioCtx.currentTime + t + 0.45);
				});
			}

			// 進入下一階段：工作→短休息（第4輪→長休息）、休息→工作
			function nextPhase(withBell) {
				if (withBell) bell();
				if (phase === 'work') {
					phase = round >= ROUND_MAX ? 'long' : 'short';
				} else {
					phase = 'work';
					if (round >= ROUND_MAX) round = 1;
					else round++;
				}
				remain = DUR[phase];
				render();
			}

			function phaseDone() {
				// 響鈴並自動進入下一階段（繼續計時）
				nextPhase(true);
				if (running) {
					endAt = Date.now() + remain * 1000;
				}
			}

			startBtn.addEventListener('click', () => (running ? pause() : start()));
			document.getElementById('reset-btn').addEventListener('click', () => {
				running = false;
				clearInterval(timerId);
				phase = 'work';
				round = 1;
				remain = DUR[phase];
				startBtn.textContent = '▶ 開始';
				render();
			});
			document.getElementById('skip-btn').addEventListener('click', () => {
				nextPhase(false);
				if (running) endAt = Date.now() + remain * 1000;
			});
			soundBtn.textContent = sound ? '音效：開' : '音效：關';
			soundBtn.addEventListener('click', () => {
				sound = !sound;
				localStorage.setItem('t-sound', sound ? '1' : '0');
				soundBtn.textContent = sound ? '音效：開' : '音效：關';
			});

			// 設定各階段分鐘數；未計時中時立即套用到當前階段
			[['work', 'dur-work'], ['short', 'dur-short'], ['long', 'dur-long']].forEach(([key, id]) => {
				const el = document.getElementById(id);
				el.value = DUR[key] / 60;
				el.addEventListener('change', () => {
					const v = Math.min(120, Math.max(1, Number(el.value) || 25));
					el.value = v;
					DUR[key] = v * 60;
					localStorage.setItem('t-pomo-' + key, String(v));
					if (!running && phase === key) remain = DUR[key];
					render();
				});
			});

			render();
		</script>
	</body>
</html>
