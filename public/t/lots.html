<!doctype html>
<html lang="zh-Hant">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" href="/favicon.ico" />
		<meta name="viewport" content="width=device-width" />
		<title>隨機抽籤程式</title>
		<script>
			(() => {
				const saved = localStorage.getItem('t-theme');
				const theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
				document.documentElement.dataset.theme = theme;
			})();
		</script>
		<style>
			:root {
				--bg: #ffffff;
				--fg: #1a1a1a;
				--muted: #8a8a8a;
				--btn-bg: rgba(0, 0, 0, 0.06);
				--btn-hover: rgba(0, 0, 0, 0.12);
				--accent: #6366f1;
				--card: rgba(0, 0, 0, 0.04);
			}
			html[data-theme='dark'] {
				--bg: #111111;
				--fg: #f5f5f5;
				--muted: #9a9a9a;
				--btn-bg: rgba(255, 255, 255, 0.08);
				--btn-hover: rgba(255, 255, 255, 0.16);
				--accent: #8b85ff;
				--card: rgba(255, 255, 255, 0.06);
			}
			body {
				margin: 0;
				min-height: 100vh;
				background: var(--bg);
				color: var(--fg);
				font-family: system-ui, -apple-system, 'Segoe UI', 'Noto Sans TC', sans-serif;
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 1.1rem;
				padding: 2.5rem 1rem 2rem;
				box-sizing: border-box;
				transition: background 0.3s, color 0.3s;
			}
			h1 {
				margin: 0;
				font-size: 1.4rem;
				color: var(--muted);
				font-weight: 600;
			}
			#links {
				position: fixed;
				top: 1rem;
				right: 1rem;
				display: flex;
				gap: 0.7rem;
			}
			#links a {
				color: var(--muted);
				text-decoration: none;
				font-size: 1.2rem;
			}
			#links a:hover {
				color: var(--fg);
			}
			#tip {
				min-height: 1.6rem;
				font-size: 1.05rem;
				font-weight: 700;
				text-align: center;
			}
			#names {
				width: min(90vw, 26rem);
				height: 8rem;
				resize: vertical;
				padding: 0.6rem 0.8rem;
				border-radius: 0.8rem;
				border: 1px solid var(--btn-hover);
				background: var(--card);
				color: inherit;
				font-size: 0.95rem;
				line-height: 1.5;
			}
			#names:focus {
				outline: 2px solid var(--accent);
			}
			.hint {
				color: var(--muted);
				font-size: 0.88rem;
				margin: 0;
			}
			.row {
				display: flex;
				gap: 0.8rem;
				align-items: center;
				flex-wrap: wrap;
				justify-content: center;
			}
			.row > * {
				font: inherit;
				padding: 0.5rem 1.2rem;
				border-radius: 999px;
				border: none;
				background: var(--btn-bg);
				color: inherit;
				cursor: pointer;
			}
			.row > *:hover {
				background: var(--btn-hover);
			}
			#start-btn {
				font-size: 1.15rem;
				font-weight: 700;
				padding: 0.7rem 2.4rem;
				background: var(--accent);
				color: #fff;
			}
			#start-btn:hover {
				filter: brightness(1.1);
				background: var(--accent);
			}
			#edit-zone {
				display: flex;
				flex-direction: column;
				align-items: center;
				gap: 1.1rem;
			}
			#play-zone {
				display: none;
				flex-direction: column;
				align-items: center;
				gap: 1.1rem;
			}
			#lots {
				display: flex;
				flex-wrap: wrap;
				gap: 0.5rem;
				justify-content: center;
				max-width: min(94vw, 44rem);
				perspective: 1100px;
			}
			.lot {
				width: 4.1rem;
				height: 6.8rem;
				cursor: pointer;
			}
			.lot-inner {
				position: relative;
				width: 100%;
				height: 100%;
				transform-style: preserve-3d;
				transition: transform 0.55s;
			}
			.lot.flipped .lot-inner {
				transform: rotateY(180deg);
			}
			.lot:hover:not(.flipped) .lot-inner {
				transform: translateY(-0.35rem);
			}
			.face {
				position: absolute;
				inset: 0;
				backface-visibility: hidden;
				-webkit-backface-visibility: hidden;
				border-radius: 0.45rem;
				display: flex;
				align-items: center;
				justify-content: center;
			}
			.face.front {
				background: linear-gradient(170deg, #e2c390, #c9a06a 55%, #b98d55);
				border: 1px solid rgba(0, 0, 0, 0.25);
				box-shadow: inset 0 0 0 3px rgba(255, 255, 255, 0.35);
			}
			.face.front::after {
				content: '籤';
				font-size: 1.3rem;
				font-weight: 700;
				color: rgba(107, 63, 29, 0.75);
			}
			.face.back {
				transform: rotateY(180deg);
				background: var(--card);
				border: 2px solid var(--accent);
			}
			.face.back .name {
				writing-mode: vertical-rl;
				font-weight: 700;
				color: var(--fg);
				letter-spacing: 0.08rem;
			}
			#shuffle-overlay {
				position: fixed;
				inset: 0;
				display: none;
				align-items: center;
				justify-content: center;
				background: rgba(0, 0, 0, 0.45);
				color: #fff;
				font-size: 2rem;
				font-weight: 700;
				z-index: 10;
			}
			#shuffle-overlay.on {
				display: flex;
			}
		</style>
	</head>
	<body>
		<div id="links">
			<a href="/t/index.html" title="工具箱">🧰</a>
			<a href="/" title="回首頁">🏠</a>
		</div>
		<h1>🎋 隨機抽籤程式</h1>
		<div id="tip">輸入名單後按「開始」，每人點一張籤看結果</div>
		<div id="edit-zone">
			<textarea id="names" spellcheck="false" aria-label="名單，每行一個">小明
小華
小美
阿強
小李
阿寶</textarea>
			<div class="row">
				<button id="start-btn">開始</button>
			</div>
			<p class="hint">每行一個項目；按「開始」會洗牌（Fisher–Yates）並蓋上籤，順序即為抽籤結果。</p>
		</div>
		<div id="play-zone">
			<div id="lots"></div>
			<div class="row">
				<button id="again-btn">🔄 重新洗籤</button>
				<button id="show-btn">👁 顯示全部</button>
				<button id="edit-btn">✏️ 編輯名單</button>
			</div>
			<p class="hint">點一張籤翻面揭曉；全部翻完可「重新洗籤」再玩一輪。</p>
		</div>
		<div id="shuffle-overlay">洗牌中…</div>
		<script>
			const tipEl = document.getElementById('tip');
			const namesEl = document.getElementById('names');
			const editZone = document.getElementById('edit-zone');
			const playZone = document.getElementById('play-zone');
			const lotsEl = document.getElementById('lots');
			const overlay = document.getElementById('shuffle-overlay');

			let items = [];

			function randInt(n) {
				const limit = Math.floor(0x100000000 / n) * n;
				const buf = new Uint32Array(1);
				let v;
				do {
					crypto.getRandomValues(buf);
					v = buf[0];
				} while (v >= limit);
				return v % n;
			}

			function escapeHtml(s) {
				const d = document.createElement('div');
				d.textContent = s;
				return d.innerHTML;
			}

			function nameFont(len) {
				// 直式籤文：字數越多字級越小（卡片高約 6rem 可用）
				return Math.max(11, Math.min(17, Math.floor(92 / Math.max(len, 1)))) + 'px';
			}

			function renderCards() {
				lotsEl.innerHTML = '';
				items.forEach((name) => {
					const lot = document.createElement('div');
					lot.className = 'lot';
					lot.setAttribute('role', 'button');
					lot.setAttribute('aria-label', '籤，點擊揭曉');
					const inner = document.createElement('div');
					inner.className = 'lot-inner';
					const front = document.createElement('div');
					front.className = 'face front';
					const back = document.createElement('div');
					back.className = 'face back';
					const nameSpan = document.createElement('span');
					nameSpan.className = 'name';
					nameSpan.style.fontSize = nameFont(name.length);
					nameSpan.textContent = name;
					back.append(nameSpan);
					inner.append(front, back);
					lot.append(inner);
					lot.dataset.name = name;
					bindFlip(lot, name);
					lotsEl.append(lot);
				});
			}

			function bindFlip(lot, name) {
				lot.addEventListener('click', () => {
					if (lot.classList.contains('flipped')) return;
					lot.querySelector('.name').textContent = name;
					lot.classList.add('flipped');
					const left = lotsEl.querySelectorAll('.lot:not(.flipped)').length;
					if (left === 0) tipEl.textContent = '全部已揭曉！按「重新洗籤」再玩一輪 🎉';
				});
			}

			function shuffleDeal() {
				const lines = namesEl.value.split('\n').map((s) => s.trim()).filter(Boolean);
				if (lines.length < 2) {
					tipEl.textContent = '請至少輸入兩個項目（每行一個）';
					return;
				}
				// Fisher–Yates 洗牌（crypto 隨機）
				items = lines.slice(0, 100);
				for (let i = items.length - 1; i > 0; i--) {
					const j = randInt(i + 1);
					[items[i], items[j]] = [items[j], items[i]];
				}
				overlay.classList.add('on');
				setTimeout(() => {
					overlay.classList.remove('on');
					editZone.style.display = 'none';
					playZone.style.display = 'flex';
					renderCards();
					tipEl.textContent = '請選一個！';
				}, 650);
			}

			document.getElementById('start-btn').addEventListener('click', shuffleDeal);
			document.getElementById('again-btn').addEventListener('click', shuffleDeal);
			document.getElementById('show-btn').addEventListener('click', () => {
				lotsEl.querySelectorAll('.lot').forEach((lot, i) => {
					lot.querySelector('.name').textContent = lot.dataset.name;
					lot.classList.add('flipped');
				});
				tipEl.textContent = '全部已揭曉！按「重新洗籤」再玩一輪 🎉';
			});
			document.getElementById('edit-btn').addEventListener('click', () => {
				playZone.style.display = 'none';
				editZone.style.display = 'flex';
				tipEl.textContent = '輸入名單後按「開始」，每人點一張籤看結果';
			});
		</script>
	</body>
</html>
