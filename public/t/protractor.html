<!doctype html>
<html lang="zh-Hant">
	<head>
		<meta charset="utf-8" />
		<link rel="icon" type="image/svg+xml" href="/favicon.svg" />
		<link rel="icon" href="/favicon.ico" />
		<meta name="viewport" content="width=device-width" />
		<title>量角器</title>
		<script>
			(() => {
				const saved = localStorage.getItem('t-theme');
				const theme = saved || (matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
				document.documentElement.dataset.theme = theme;
			})();
		</script>
		<style>
			:root {
				--bg: #ffffff;
				--fg: #1a1a1a;
				--muted: #8a8a8a;
				--btn-bg: rgba(0, 0, 0, 0.06);
				--btn-hover: rgba(0, 0, 0, 0.12);
				--accent: #6366f1;
			}
			html[data-theme='dark'] {
				--bg: #111111;
				--fg: #f5f5f5;
				--muted: #9a9a9a;
				--btn-bg: rgba(255, 255, 255, 0.08);
				--btn-hover: rgba(255, 255, 255, 0.16);
				--accent: #8b85ff;
			}
			html,
			body {
				height: 100%;
			}
			body {
				margin: 0;
				background: var(--bg);
				color: var(--fg);
				font-family: system-ui, -apple-system, 'Segoe UI', 'Noto Sans TC', sans-serif;
				display: flex;
				flex-direction: column;
				transition: background 0.3s, color 0.3s;
				overflow: hidden;
			}
			#links {
				position: fixed;
				top: 0.8rem;
				right: 0.8rem;
				display: flex;
				gap: 0.7rem;
				z-index: 30;
			}
			#links a {
				color: var(--muted);
				text-decoration: none;
				font-size: 1.2rem;
			}
			#links a:hover {
				color: var(--fg);
			}
			#bar {
				display: flex;
				gap: 0.9rem;
				align-items: center;
				justify-content: center;
				flex-wrap: wrap;
				padding: 0.7rem 1rem;
				z-index: 20;
			}
			#bar > * {
				font: inherit;
				font-size: 0.95rem;
				padding: 0.45rem 1.1rem;
				border-radius: 999px;
				border: none;
				background: var(--btn-bg);
				color: inherit;
				cursor: pointer;
			}
			#bar > *:hover {
				background: var(--btn-hover);
			}
			#bar label {
				display: flex;
				align-items: center;
				gap: 0.4rem;
			}
			#cam-btn.cam-on {
				background: #e6532e;
				color: #fff;
				font-weight: 700;
			}
			#stage {
				position: relative;
				flex: 1;
				margin: 0 0.6rem 0.6rem;
				border-radius: 0.8rem;
				overflow: hidden;
				background: var(--card);
				touch-action: none;
			}
			#mirror {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				object-fit: cover;
				display: none;
			}
			#mirror.on {
				display: block;
			}
			#cv {
				position: absolute;
				inset: 0;
				width: 100%;
				height: 100%;
				touch-action: none;
			}
			.deg-box {
				position: absolute;
				display: flex;
				align-items: center;
				gap: 0.3rem;
				background: var(--bg);
				border: 1px solid var(--btn-hover);
				border-radius: 0.5rem;
				padding: 0.2rem 0.5rem;
				font-size: 0.9rem;
				z-index: 10;
				transform: translate(-50%, -50%);
				box-shadow: 0 2px 8px rgba(0, 0, 0, 0.18);
			}
			.deg-box input {
				font: inherit;
				font-weight: 700;
				width: 3.2rem;
				text-align: center;
				border: none;
				background: transparent;
				color: var(--accent);
				font-size: 1.05rem;
			}
			.deg-box input:focus {
				outline: none;
			}
			#tip {
				text-align: center;
				color: var(--muted);
				font-size: 0.85rem;
				padding: 0 1rem 0.6rem;
				z-index: 20;
			}
		</style>
	</head>
	<body>
		<div id="links">
			<a href="/t/index.html" title="工具箱">🧰</a>
			<a href="/" title="回首頁">🏠</a>
		</div>
		<div id="bar">
			<label><input type="checkbox" id="show-pin" checked /> 顯示釘住圖示</label>
			<button id="zero-btn">⊙ 臂歸 90°</button>
			<button id="cam-btn">📷 相機背景</button>
			<span id="cam-tip"></span>
		</div>
		<div id="stage">
			<video id="mirror" autoplay playsinline muted></video>
			<canvas id="cv"></canvas>
			<div class="deg-box" id="box-left"><input type="number" id="deg-left" min="0" max="180" value="90" /><span>左刻度</span></div>
			<div class="deg-box" id="box-right"><span>右刻度</span><input type="number" id="deg-right" min="0" max="180" value="90" /></div>
		</div>
		<div id="tip">拖動紅色圖釘定頂點，拖動臂端圓點旋轉量角臂；也可直接輸入左／右刻度角度。半透明量角器可對著螢幕上的物件比對，或開相機背景對準實物。</div>
		<script>
			const stage = document.getElementById('stage');
			const cv = document.getElementById('cv');
			const ctx = cv.getContext('2d');
			const mirror = document.getElementById('mirror');
			const degL = document.getElementById('deg-left');
			const degR = document.getElementById('deg-right');
			const boxL = document.getElementById('box-left');
			const boxR = document.getElementById('box-right');
			const showPin = document.getElementById('show-pin');
			const camBtn = document.getElementById('cam-btn');
			const camTip = document.getElementById('cam-tip');

			// 狀態：pin=頂點，theta=量角臂角度（0°朝右、90°朝上、180°朝左）
			let W = 0,
				H = 0;
			let center = { x: 0, y: 0 };
			let R = 200;
			let pin = { x: 0, y: 0 };
			let theta = 90;
			let drag = null; // 'pin' | 'handle' | null
			let stream = null;

			function resize() {
				W = stage.clientWidth;
				H = stage.clientHeight;
				cv.width = W;
				cv.height = H;
				center = { x: W / 2, y: Math.min(H * 0.78, H - R - 8) };
				R = Math.min(W * 0.44, H * 0.6);
				center = { x: W / 2, y: Math.min(H * 0.78, H - 8) };
				if (!pin.x) pin = { x: center.x, y: center.y };
				layoutBoxes();
				draw();
			}
			window.addEventListener('resize', resize);

			function armLen() {
				return R * 1.04;
			}
			function armEnd() {
				return { x: pin.x + Math.cos((theta * Math.PI) / 180) * armLen(), y: pin.y - Math.sin((theta * Math.PI) / 180) * armLen() };
			}

			function layoutBoxes() {
				boxL.style.left = Math.max(60, center.x - R * 0.72) + 'px';
				boxL.style.top = center.y + 26 + 'px';
				boxR.style.left = Math.min(W - 60, center.x + R * 0.72) + 'px';
				boxR.style.top = center.y + 26 + 'px';
			}

			function themeColors() {
				const dark = document.documentElement.dataset.theme === 'dark';
				return {
					fill: dark ? 'rgba(40,40,46,0.62)' : 'rgba(255,255,255,0.62)',
					major: 'rgba(230,83,46,0.95)',
					minor: dark ? 'rgba(220,220,220,0.75)' : 'rgba(60,60,60,0.8)',
					text: dark ? '#eee' : '#222',
					line: dark ? '#ffb0a0' : '#e6532e',
					pin: '#e6303c',
				};
			}

			function draw() {
				ctx.clearRect(0, 0, W, H);
				const c = themeColors();
				// --- 量角器本體（半透明半圓） ---
				ctx.beginPath();
				ctx.arc(center.x, center.y, R, Math.PI, 2 * Math.PI);
				ctx.closePath();
				ctx.fillStyle = c.fill;
				ctx.fill();
				ctx.strokeStyle = c.minor;
				ctx.lineWidth = 1.5;
				ctx.stroke();
				// 刻度：每 1°，5° 中刻度，10° 主刻度＋數字
				ctx.font = '13px system-ui, sans-serif';
				ctx.textAlign = 'center';
				ctx.textBaseline = 'middle';
				for (let a = 0; a <= 180; a++) {
					const rad = (a * Math.PI) / 180;
					const dx = Math.cos(rad);
					const dy = -Math.sin(rad);
					const major = a % 10 === 0;
					const mid = a % 5 === 0;
					const len = major ? 18 : mid ? 12 : 7;
					ctx.strokeStyle = major ? c.major : c.minor;
					ctx.lineWidth = major ? 1.8 : 1;
					ctx.beginPath();
					ctx.moveTo(center.x + dx * R, center.y + dy * R);
					ctx.lineTo(center.x + dx * (R - len), center.y + dy * (R - len));
					ctx.stroke();
					if (major) {
						ctx.fillStyle = c.text;
						ctx.fillText(String(a), center.x + dx * (R - 32), center.y + dy * (R - 32));
					}
				}
				// 基線（直徑）與延伸
				ctx.strokeStyle = c.minor;
				ctx.lineWidth = 1.5;
				ctx.beginPath();
				ctx.moveTo(center.x - R - 14, center.y);
				ctx.lineTo(center.x + R + 14, center.y);
				ctx.stroke();
				// 中心十字
				ctx.beginPath();
				ctx.moveTo(center.x - 10, center.y);
				ctx.lineTo(center.x + 10, center.y);
				ctx.moveTo(center.x, center.y - 10);
				ctx.lineTo(center.x, center.y + 10);
				ctx.stroke();
				// --- 量角臂 ---
				const end = armEnd();
				ctx.strokeStyle = c.line;
				ctx.lineWidth = 3;
				ctx.beginPath();
				ctx.moveTo(pin.x, pin.y);
				ctx.lineTo(end.x, end.y);
				ctx.stroke();
				// 臂端拖點
				ctx.beginPath();
				ctx.arc(end.x, end.y, 9, 0, Math.PI * 2);
				ctx.fillStyle = c.line;
				ctx.fill();
				ctx.strokeStyle = '#fff';
				ctx.lineWidth = 2;
				ctx.stroke();
				// --- 圖釘（頂點） ---
				if (showPin.checked) {
					ctx.beginPath();
					ctx.arc(pin.x, pin.y, 8, 0, Math.PI * 2);
					ctx.fillStyle = c.pin;
					ctx.fill();
					ctx.strokeStyle = '#fff';
					ctx.lineWidth = 2;
					ctx.stroke();
					ctx.beginPath();
					ctx.arc(pin.x, pin.y, 2.5, 0, Math.PI * 2);
					ctx.fillStyle = '#fff';
					ctx.fill();
				}
			}

			function setTheta(t) {
				theta = Math.max(0, Math.min(180, Math.round(t * 10) / 10));
				degR.value = Math.round(theta);
				degL.value = 180 - Math.round(theta);
				draw();
			}

			// 輸入角度（左刻度輸入的是 180−θ）
			function onDegInput(e) {
				const v = Number(e.target.value);
				if (Number.isNaN(v) || v < 0 || v > 180) return;
				setTheta(e.target === degL ? 180 - v : v);
			}
			degL.addEventListener('input', onDegInput);
			degR.addEventListener('input', onDegInput);

			// --- 拖曳（pin / 臂端） ---
			function ptr(e) {
				const r = cv.getBoundingClientRect();
				return { x: ((e.clientX - r.left) / r.width) * W, y: ((e.clientY - r.top) / r.height) * H };
			}
			cv.addEventListener('pointerdown', (e) => {
				const p = ptr(e);
				const end = armEnd();
				const near = (q) => Math.hypot(p.x - q.x, p.y - q.y) < 24;
				if (near(end)) drag = 'handle';
				else if (showPin.checked && near(pin)) drag = 'pin';
				else if (near(center)) drag = 'pin';
				if (drag) cv.setPointerCapture(e.pointerId);
			});
			cv.addEventListener('pointermove', (e) => {
				if (!drag) return;
				const p = ptr(e);
				if (drag === 'pin') {
					pin = { x: Math.max(4, Math.min(W - 4, p.x)), y: Math.max(4, Math.min(H - 4, p.y)) };
				} else {
					let t = (Math.atan2(pin.y - p.y, p.x - pin.x) * 180) / Math.PI;
					t = Math.max(0, Math.min(180, t));
					theta = Math.round(t * 10) / 10;
					degR.value = Math.round(theta);
					degL.value = 180 - Math.round(theta);
				}
				draw();
			});
			cv.addEventListener('pointerup', () => (drag = null));
			cv.addEventListener('pointercancel', () => (drag = null));

			showPin.addEventListener('change', draw);
			document.getElementById('zero-btn').addEventListener('click', () => {
				pin = { x: center.x, y: center.y };
				setTheta(90);
			});

			// --- 相機背景 ---
			async function startCam() {
				try {
					stream = await navigator.mediaDevices.getUserMedia({
						video: { facingMode: 'environment', width: { ideal: 4096 }, height: { ideal: 2304 } },
						audio: false,
					});
					mirror.srcObject = stream;
					mirror.classList.add('on');
					camBtn.textContent = '⏹ 關閉相機';
					camBtn.classList.add('cam-on');
					camTip.textContent = '';
					if (stage.requestFullscreen) stage.requestFullscreen().catch(() => {});
				} catch (err) {
					camTip.textContent = '相機無法使用（需授權且以 https 開啟）';
				}
			}
			function stopCam() {
				if (stream) {
					stream.getTracks().forEach((t) => t.stop());
					stream = null;
				}
				mirror.classList.remove('on');
				camBtn.textContent = '📷 相機背景';
				camBtn.classList.remove('cam-on');
			}
			camBtn.addEventListener('click', () => (stream ? (stopCam(), document.exitFullscreen?.().catch(() => {})) : startCam()));

			resize();
			setTheta(90);
		</script>
	</body>
</html>
